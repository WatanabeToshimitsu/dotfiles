name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned GitHub Actions
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning install.sh test/test-install.sh test/test-dotfiles-doctor.sh test/test-dotfiles-secrets.sh test/test-external-dependencies.sh test/test-claude-sandbox.sh test/test-claude-hooks.sh test/test-launchd.sh test/test-secret-scan.sh claude/hooks/*.sh .shell-utils/*.sh .shell-utils/claude-sandbox
      - name: Test 1Password secret rendering
        run: bash test/test-dotfiles-secrets.sh
      - name: Test dotfiles doctor
        run: bash test/test-dotfiles-doctor.sh
      - name: Test Claude hooks
        run: bash test/test-claude-hooks.sh
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Test headroom proxy check
        run: zsh test/test-headroom-proxy-check.zsh
      - name: Test Claude sandbox canary
        run: bash test/test-claude-sandbox.sh
      - name: Test launchd agent
        run: bash test/test-launchd.sh
      - name: Test tool-output compaction
        run: python3 -m unittest discover -s claude/hooks/tests -p 'test_*.py'

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan Git history
        run: gitleaks git --redact --verbose --timeout 300 .
      - name: Test public-repository boundary
        run: bash test/test-secret-scan.sh
      - name: Test external dependency boundary
        run: bash test/test-external-dependencies.sh

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate TOML (herdr)
        run: |
          python3 - <<'PY'
          import glob, tomllib
          for path in [".config/herdr/config.toml", *glob.glob("herdr-plugins/*/herdr-plugin.toml")]:
              with open(path, "rb") as f:
                  tomllib.load(f)
              print("OK", path)
          PY
      - name: Validate JSON (claude, renovate)
        run: |
          python3 - <<'PY'
          import json
          for path in ["claude/settings.json", "claude/sandbox-canary.json", "claude/claude-powerline.json", "renovate.json"]:
              with open(path) as f:
                  json.load(f)
              print("OK", path)
          PY
      - name: Validate JSONC (VS Code)
        run: |
          npx --yes json5@2.2.3 vscode/settings.json > /dev/null
          npx --yes json5@2.2.3 vscode/keybindings.json > /dev/null

  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test launchd agent
        run: bash test/test-launchd.sh
      - name: Test dotfiles doctor
        run: bash test/test-dotfiles-doctor.sh
      - name: Test Claude hooks
        run: bash test/test-claude-hooks.sh
      - name: Test headroom proxy check
        run: zsh test/test-headroom-proxy-check.zsh

  install-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test image
        run: docker build -f test/Dockerfile.ubuntu -t dotfiles-test .
      - name: Run install test
        run: docker run --rm dotfiles-test bash test/test-install.sh
