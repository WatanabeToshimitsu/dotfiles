name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh test/test-install.sh test/test-dotfiles-doctor.sh test/test-claude-sandbox.sh test/test-claude-hooks.sh claude/hooks/*.sh .shell-utils/*.sh .shell-utils/claude-sandbox
      - name: Test dotfiles doctor
        run: bash test/test-dotfiles-doctor.sh
      - name: Test Claude hooks
        run: bash test/test-claude-hooks.sh
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Test headroom proxy check
        run: zsh test/test-headroom-proxy-check.zsh
      - name: Test Claude sandbox canary
        run: bash test/test-claude-sandbox.sh
      - name: Test tool-output compaction
        run: python3 -m unittest discover -s claude/hooks/tests -p 'test_*.py'

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TOML (herdr)
        run: |
          python3 - <<'PY'
          import glob, tomllib
          for path in [".config/herdr/config.toml", *glob.glob("herdr-plugins/*/herdr-plugin.toml")]:
              with open(path, "rb") as f:
                  tomllib.load(f)
              print("OK", path)
          PY
      - name: Validate JSON (claude, renovate)
        run: |
          python3 - <<'PY'
          import json
          for path in ["claude/settings.json", "claude/sandbox-canary.json", "claude/claude-powerline.json", "renovate.json"]:
              with open(path) as f:
                  json.load(f)
              print("OK", path)
          PY
      - name: Validate JSONC (VS Code)
        run: |
          npx --yes json5 vscode/settings.json > /dev/null
          npx --yes json5 vscode/keybindings.json > /dev/null

  install-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -f test/Dockerfile.ubuntu -t dotfiles-test .
      - name: Run install test
        run: docker run --rm dotfiles-test bash test/test-install.sh
