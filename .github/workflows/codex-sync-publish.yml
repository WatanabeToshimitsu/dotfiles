name: Codex sync publisher
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: codex-sync-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Generate from PR data with the reviewed base implementation
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REPO: ${{ github.repository }}
          SYNC_PR: ${{ github.event.pull_request.number }}
          SYNC_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/codex-sync/publish.py
          --repo "$SYNC_REPO" --pr "$SYNC_PR" --expected-head "$SYNC_HEAD"
