name: Codex sync preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate public preview
        run: |
          python3 scripts/codex-sync/generate.py
          git add -N codex/generated
          git diff --binary -- codex/generated > "$RUNNER_TEMP/codex-sync.patch"
      - name: Upload generated difference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-sync-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/codex-sync.patch
          retention-days: 7
